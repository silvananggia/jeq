server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend service
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy UI device (Tailscale/LAN) lewat origin publik.
    # Browser tidak langsung hit IP privat → lolos Chrome Local Network Access.
    # Hanya IP privat / Tailscale CGNAT (100.64.0.0/10).
    location ~ ^/device-proxy/(?<device_ip>[0-9.]+)/(?<device_port>[0-9]+)(?<device_uri>/.*)$ {
        if ($device_ip !~ "^(10\.|127\.|192\.168\.|100\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)") {
            return 403;
        }

        # Variable proxy_pass membutuhkan resolver (IP literal tetap OK)
        resolver 127.0.0.11 ipv6=off valid=30s;
        resolver 8.8.8.8 ipv6=off valid=30s;

        proxy_pass http://$device_ip:$device_port$device_uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $device_ip:$device_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Agar bisa di-iframe dari halaman JEQ
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;

        # Rewrite path absolut di HTML/CSS agar asset tetap lewat proxy
        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/device-proxy/$device_ip/$device_port/';
        sub_filter "href='/" "href='/device-proxy/$device_ip/$device_port/";
        sub_filter 'src="/' 'src="/device-proxy/$device_ip/$device_port/';
        sub_filter "src='/" "src='/device-proxy/$device_ip/$device_port/";
        sub_filter 'url(/' 'url(/device-proxy/$device_ip/$device_port/';
        sub_filter 'url("/' 'url("/device-proxy/$device_ip/$device_port/';

        # Rewrite redirect absolut dari device ke path proxy
        proxy_redirect ~^https?://([^:/]+)(?::(\d+))?/(.*)$ /device-proxy/$1/$device_port/$3;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
