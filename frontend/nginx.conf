server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend di host:4000 (frontend network_mode: host)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy HTTP ke device Tailscale/LAN (tanpa WebSocket)
    location ~ ^/device-proxy/([0-9.]+)/([0-9]+)(/.*)$ {
        set $dip $1;
        set $dport $2;
        set $duri $3;

        if ($dip !~ "^(10\.|127\.|192\.168\.|100\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)") {
            return 403;
        }

        resolver 127.0.0.53 ipv6=off valid=30s;

        proxy_pass http://$dip:$dport$duri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $dip:$dport;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_redirect off;
    }
}
