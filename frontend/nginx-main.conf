worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # WebSocket upgrade (realtime iframe device)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Ambil target device dari Referer /device-proxy/IP/PORT/...
    # Dipakai endpoint absolut seperti /socket.io yang tidak kena path prefix.
    map $http_referer $device_from_referer {
        ~*/device-proxy/([0-9.]+)/([0-9]+)  $1:$2;
        default                            "";
    }

    include /etc/nginx/conf.d/*.conf;
}
