worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Target device dari Referer iframe /device-proxy/IP/PORT/...
    map $http_referer $device_from_referer {
        ~*/device-proxy/([0-9.]+)/([0-9]+)  $1:$2;
        default                            "";
    }

    # Fallback cookie (diset saat buka device-proxy) jika Referer kosong
    map $device_from_referer $device_upstream {
        ""      $cookie_jeq_device;
        default $device_from_referer;
    }

    include /etc/nginx/conf.d/*.conf;
}
