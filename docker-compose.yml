services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Host network: nginx bisa reach IP Tailscale device (100.x) seperti host.
    # Wajib untuk pola: web publik + iframe via Tailscale di server.
    network_mode: host
